<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#06051a"/>
    </radialGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>

  <!-- Disc with rust-orange ring, as the suite draws it -->
  <circle cx="128" cy="128" r="120" fill="url(#disc)" stroke="url(#rust)" stroke-width="3"/>

  <!-- A key cap -->
  <rect x="64" y="66" width="128" height="112" rx="16" fill="#0a0a14" stroke="url(#rust)" stroke-width="4"/>
  <rect x="78" y="78" width="100" height="84" rx="10" fill="none" stroke="#f74c00" stroke-width="1.2" opacity="0.35"/>

  <!-- Pixel figure on the key: a little jumping man, half-block pixels -->
  <g fill="#f4ead8">
    <rect x="120" y="90" width="16" height="8"/>
    <rect x="112" y="98" width="32" height="8"/>
    <rect x="104" y="106" width="8" height="8"/>
    <rect x="144" y="106" width="8" height="8"/>
    <rect x="120" y="114" width="16" height="8"/>
  </g>
  <g fill="url(#rust)">
    <rect x="112" y="122" width="12" height="8"/>
    <rect x="132" y="122" width="12" height="8"/>
    <rect x="104" y="130" width="12" height="8"/>
    <rect x="140" y="130" width="12" height="8"/>
  </g>
  <!-- Fn in the corner, as on a keyboard -->
  <text x="86" y="156" font-family="monospace" font-size="16" font-weight="bold" fill="#f74c00" opacity="0.9">Fn</text>

  <!-- wordmark -->
  <text x="128" y="232" font-family="monospace" font-size="22" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="6">funkey</text>
</svg>
