[package]
name = "fe2o3-funkey"
version = "0.5.0"
edition = "2021"
description = "A game engine for the terminal: pixels as half blocks or real pixels, held keys, a fixed-step loop, sprites, tiles, platformer physics, sound, a Doom renderer and a 3D rasterizer"
license = "Unlicense"
repository = "https://github.com/isene/funkey"
authors = ["Geir Isene <g@isene.com>"]

[lib]
name = "funkey"

[dependencies]
crust = { version = "0.1.54", path = "../crust", package = "fe2o3-crust" }
glow  = { version = "0.1.28", path = "../glow", package = "fe2o3-glow" }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
