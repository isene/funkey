name: Release

# Every tag builds the picker and all the games, so the latest release
# always carries the whole set: the engine's v0.4.3 as well as a game's
# doom-v1.1 or the picker's funkeys-v1.0.
on:
  push:
    tags:
      - 'v*'
      - '*-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          path: funkey

      - name: Checkout crust
        uses: actions/checkout@v4
        with:
          repository: isene/crust
          path: crust

      - name: Checkout glow
        uses: actions/checkout@v4
        with:
          repository: isene/glow
          path: glow

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build the picker and the games
        working-directory: funkey
        run: cargo build --release --target ${{ matrix.target }} --bin funkeys --examples

      - name: Package
        working-directory: funkey
        run: |
          mkdir -p ../out
          cp target/${{ matrix.target }}/release/funkeys ../out/funkeys-${{ matrix.suffix }}
          for g in climb jumpman invaders drive soar doom; do
            cp target/${{ matrix.target }}/release/examples/$g ../out/$g-${{ matrix.suffix }}
          done
          chmod +x ../out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: out/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            `funkeys` is the picker; `climb`, `jumpman`, `invaders`, `drive`,
            `soar` and `doom` are the games. Take the ones you want:

            ```bash
            for b in funkeys climb jumpman invaders drive soar doom; do
              curl -L "https://github.com/isene/funkey/releases/latest/download/$b-linux-x86_64" \
                -o ~/bin/$b && chmod +x ~/bin/$b
            done
            ```

            Doom wants a WAD at `~/.funkey/freedoom1.wad`; Freedoom is free at
            https://freedoom.github.io/.

            ## Platforms
            - `*-linux-x86_64` - Linux (Intel/AMD 64-bit)
            - `*-linux-aarch64` - Linux (ARM 64-bit, Raspberry Pi)
            - `*-macos-x86_64` - macOS (Intel)
            - `*-macos-aarch64` - macOS (Apple Silicon)

      - name: Upload the binaries, one at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upload endpoint answers 500 when several files go up at once.
          for f in artifacts/*/*; do
            for try in 1 2 3; do
              gh release upload "$GITHUB_REF_NAME" "$f" --clobber && break
              echo "upload of $f failed; waiting 10 s"
              sleep 10
            done
          done
