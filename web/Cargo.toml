# funkey games built for a web page, one game per build:
#
#   cargo build --release --target wasm32-unknown-unknown --features eliminator
#
# (or again, climb, drive, gems, invaders, jumpman, kart, marble, salvo, stack, vector)
#
# gives target/wasm32-unknown-unknown/release/funkey_web.wasm, which
# funkey.js plays in a canvas (see index.html).
[package]
name = "funkey-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "Unlicense"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[features]
again = []
climb = []
drive = []
eliminator = []
gems = []
invaders = []
jumpman = []
kart = []
marble = []
salvo = []
stack = []
vector = []

[dependencies]
funkey = { path = "..", package = "fe2o3-funkey", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
